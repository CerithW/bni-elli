<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BNI Passport to Success: the new member's passport, mentor crib sheets for all ten sessions, the Mentor Coordinator's tracker and the reference rules.">
<meta name="color-scheme" content="light dark">
<title>Passport to Success</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
</style>
<style>
/* Layout: red masthead → sticky tab rail → one column of cards (max 920px).
   Passport "pages" are cards that take a red ink stamp when a session is signed off. */
:root{
  --brand:#CF2030; --on-brand:#FFFFFF;
  --accent:#CF2030; --accent-ink:#B5121F; --accent-soft:#FBE9EA;
  --bg:#F4F4F2; --surface:#FFFFFF; --surface-2:#ECECEA; --fg:#1C1D1F; --muted:#66696D; --line:#DADAD6;
  --green:#2F7D32; --green-soft:#E3F1E4; --amber:#A86300; --amber-soft:#FBEEDC; --blue:#1A5FB4; --blue-soft:#E2ECF9; --tlgrey:#7B7E82; --tlgrey-soft:#EBEBEC;
  --display:"Arial Black","Archivo Black",Arial,Helvetica,sans-serif;
  --body:Arial,Helvetica,"Liberation Sans",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131416; --surface:#1C1D20; --surface-2:#26282C; --fg:#ECEDEE; --muted:#A5A8AC; --line:#303236;
    --accent:#E8555F; --accent-ink:#F2707A; --accent-soft:#3A1F22;
    --green:#74C478; --green-soft:#1E3320; --amber:#F2B45A; --amber-soft:#3A2C14; --blue:#7AB6F5; --blue-soft:#182A40; --tlgrey:#A0A3A7; --tlgrey-soft:#2B2D31;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131416; --surface:#1C1D20; --surface-2:#26282C; --fg:#ECEDEE; --muted:#A5A8AC; --line:#303236;
  --accent:#E8555F; --accent-ink:#F2707A; --accent-soft:#3A1F22;
  --green:#74C478; --green-soft:#1E3320; --amber:#F2B45A; --amber-soft:#3A2C14; --blue:#7AB6F5; --blue-soft:#182A40; --tlgrey:#A0A3A7; --tlgrey-soft:#2B2D31;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;letter-spacing:-0.01em;text-wrap:balance;margin:0}
h1{font-size:1.5rem;line-height:1.15}
h2{font-size:1.2rem;line-height:1.25}
h3{font-size:1rem;line-height:1.3}
h4{font-family:var(--body);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
ul,ol{margin:0;padding-left:1.2em}
li+li{margin-top:.35em}
a{color:var(--blue)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:.5em .65em;min-width:0;max-width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mast{background:var(--brand);color:var(--on-brand)}
.mast .in{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-block:1.1rem 1rem}
.mast .eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;opacity:.9;margin-bottom:.25rem}
.mast h1{color:var(--on-brand)}
.mast .sub{font-size:.85rem;opacity:.92;max-width:34ch}
.in{max-width:920px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;padding-block:.4rem}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;padding:.55rem .85rem;border-radius:8px;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap;display:flex;gap:.45rem;align-items:center}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.tab .k{font-family:var(--display);font-size:.7rem;opacity:.7}
main .in{padding-block:1.25rem 4rem;display:grid;gap:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent}
.stack{display:grid;gap:.75rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.76rem}
.lead{font-size:1.02rem;max-width:62ch}
.prose{max-width:66ch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5rem .85rem;cursor:pointer;font-weight:700;font-size:.88rem;display:inline-flex;align-items:center;gap:.4rem;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(.93)}
.btn.danger{color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:.35rem .6rem;font-size:.8rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue)}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.2rem .6rem;font-size:.76rem;font-weight:700;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.red{background:var(--accent-soft);color:var(--accent-ink)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.grey{background:var(--tlgrey-soft);color:var(--tlgrey)}
.dot{width:.55em;height:.55em;border-radius:50%;background:currentColor;display:inline-block}
.notice{border-left:4px solid var(--accent);background:var(--accent-soft);padding:.75rem .9rem;border-radius:6px;color:var(--fg)}
.notice strong{color:var(--accent-ink)}
/* progress */
.prog{display:grid;gap:3px;height:10px}
.prog i{display:block;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.prog i.on{background:var(--accent);border-color:var(--accent)}
.prog i.ms{border-style:dashed}
/* passport pages */
.page{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:start}
.page .num{font-family:var(--display);font-size:1.6rem;line-height:1;color:var(--accent);min-width:2.2ch;text-align:right;padding-top:.1rem}
.page .num.ms{font-size:.95rem;padding-top:.45rem;color:var(--muted)}
.page .title{font-weight:700;font-size:1rem;line-height:1.3}
.page .meta{font-size:.82rem;color:var(--muted);margin-top:.15rem}
.page .status{min-width:0}
.pagehead{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:start;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.pagebody{margin-top:.9rem;padding-top:.9rem;border-top:1px dashed var(--line);display:grid;gap:.9rem}
.sec h4{margin-bottom:.3rem}
.stamp{width:78px;height:78px;border:3px solid var(--accent);border-radius:50%;display:grid;place-content:center;text-align:center;transform:rotate(-12deg);color:var(--accent);font-family:var(--display);font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;line-height:1.15;opacity:.95;box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 3px var(--accent)}
.stamp b{display:block;font-size:.62rem;margin-top:.15em;font-family:var(--body);letter-spacing:0;text-transform:none}
.stamp.todo{border-style:dashed;color:var(--muted);border-color:var(--line);box-shadow:none;transform:none;font-size:.56rem}
.stamp.next{border-color:var(--amber);color:var(--amber);border-style:dashed;box-shadow:none;transform:none}
/* mentor picker */
.picker{display:flex;gap:.4rem;flex-wrap:wrap}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.45rem .6rem;cursor:pointer;font-size:.82rem;font-weight:700;display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;min-width:0;max-width:100%}
.pick .n{font-family:var(--display);color:var(--accent);font-size:.9rem}
.pick[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.pick span.t{font-weight:400;color:var(--muted);font-size:.74rem;text-align:left}
.crib{display:grid;gap:1rem}
.crib .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:640px){.crib .grid2{grid-template-columns:1fr}}
.timing{display:flex;gap:.75rem;align-items:center;background:var(--surface-2);border-radius:8px;padding:.7rem .85rem}
.timing .big{font-family:var(--display);font-size:1.4rem;color:var(--accent);line-height:1}
/* tracker */
.member{display:grid;gap:.75rem}
.member .top{display:grid;grid-template-columns:1fr auto;gap:.75rem;align-items:start}
.member .name{font-weight:700;font-size:1.05rem}
.strip{display:flex;gap:.35rem;flex-wrap:wrap}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:7px;min-width:44px;height:46px;padding:0 .4rem;cursor:pointer;display:grid;place-items:center;font-size:.74rem;font-weight:700;line-height:1;color:var(--muted)}
.cell.on{background:var(--accent);border-color:var(--accent);color:var(--on-brand)}
.cell.ms{border-style:dashed}
.cell.ms.on{border-style:solid}
.cell small{font-weight:400;font-size:.62rem;opacity:.85;margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.15rem .75rem;font-size:.86rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tablewrap{overflow-x:auto;max-width:100%}
td input{width:100%}
.form{display:grid;grid-template-columns:2fr 2fr 1.4fr auto;gap:.5rem;align-items:end}
.form label{display:grid;gap:.25rem;font-size:.76rem;font-weight:700;color:var(--muted)}
.form label input{width:100%}
@media (max-width:640px){.form{grid-template-columns:1fr 1fr}.form .span{grid-column:1/-1}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem}
.stat{background:var(--surface-2);border-radius:8px;padding:.6rem .75rem}
.stat .v{font-family:var(--display);font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:.15rem}
/* reference */
details{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details+details{margin-top:.6rem}
summary{cursor:pointer;padding:.85rem 1.1rem;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:1rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--display);color:var(--accent);font-size:1.1rem}
details[open] summary::after{content:"–"}
details .body{padding:0 1.1rem 1rem;display:grid;gap:.75rem}
.glossary{display:grid;grid-template-columns:auto 1fr;gap:.3rem .9rem;font-size:.9rem}
.glossary b{font-family:var(--display);color:var(--accent);font-weight:400}
.tl{display:grid;gap:.4rem}
.tl div{display:flex;gap:.6rem;align-items:baseline}
.tl i{width:14px;height:14px;border-radius:50%;flex:0 0 auto;transform:translateY(2px)}
.levels{display:grid;gap:.5rem}
.levels div{display:grid;grid-template-columns:auto 1fr;gap:.75rem;align-items:start}
.levels .lv{font-family:var(--display);color:var(--accent);font-size:1.1rem;line-height:1.2;min-width:2.4ch}
.script{background:var(--surface-2);border-radius:8px;padding:.85rem 1rem;white-space:pre-wrap;font-size:.9rem;line-height:1.5}
.checklist{display:grid;gap:.45rem}
.checklist label{display:flex;gap:.6rem;align-items:flex-start;font-size:.9rem;cursor:pointer}
.checklist input{margin-top:.2rem;flex:0 0 auto}
.checklist label.done{color:var(--muted);text-decoration:line-through}
/* overlay sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;z-index:20;padding:0}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:720px;border-radius:14px 14px 0 0;padding:1rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px));display:grid;gap:.75rem;max-height:85vh}
.sheet textarea{width:100%;min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-size:.85rem;font-weight:700;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:1.5rem 1rem;border:1px dashed var(--line);border-radius:var(--r)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:700px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="mast">
  <div class="in">
    <div>
      <div class="eyebrow" id="eyebrow">BNI new member mentoring</div>
      <h1>Passport to Success</h1>
    </div>
    <p class="sub">Ten one-hour 121s with ten different members. Ten to fifteen minutes of BNI each; the rest is getting to know each other.</p>
  </div>
</header>
<nav class="rail" aria-label="Sections">
  <div class="in">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-view="passport" id="tab-passport"><span class="k">01</span>My Passport</button>
      <button class="tab" role="tab" data-view="mentor" id="tab-mentor"><span class="k">02</span>Mentor crib sheets</button>
      <button class="tab" role="tab" data-view="tracker" id="tab-tracker"><span class="k">03</span>Coordinator tracker</button>
      <button class="tab" role="tab" data-view="reference" id="tab-reference"><span class="k">04</span>Reference</button>
    </div>
  </div>
</nav>
<main><div class="in" id="view"></div></main>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="row between"><h3 id="sheet-title">Copy</h3><button class="btn sm" id="sheet-close">Close</button></div>
    <p class="small muted" id="sheet-help"></p>
    <textarea id="sheet-text" aria-label="Text"></textarea>
    <div class="row" id="sheet-actions"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------------- Chapter setup: edit this block for your chapter ---------------- */
const CHAPTER = {
  name: 'BNI Elli',
  // Who delivers each session: the usual mentor first, then the alternative. From the chapter's Mentor Tracking Sheet.
  mentors: {
    '1': ['Matthew', 'Eleanor'],
    '2': ['Rhys D', 'Cerith'],
    '3': ['James R', 'David D'],
    '4': ['Des', 'Carys'],
    '5': ['Phil', 'Cerith'],
    '6': ['David', 'Cerith'],
    '7': ['Cerith', 'David'],
    '8': ['Eleanor', 'David'],
    '9': ['John L', 'Rachel'],
    '10': ['Eleanor', 'Barrie H']
  },
  // Tracked beyond the ten sessions and MSP. Add 'LP' for Launch Pad and 'RT' for the Regional Team sign-off if the chapter uses them.
  extraItems: [],
  // New members already in the programme, loaded the first time the tracker opens on a device.
  seedDate: '2026-10-22',
  seed: [
    { name: 'Luke E',  inducted: '2026-05-01', msp: true },
    { name: 'Suzzane', inducted: '2026-07-01', msp: true },
    { name: 'Anthony', inducted: '2026-07-01' },
    { name: 'James',   inducted: '2026-10-15' },
    { name: 'Jon G',   inducted: '2026-10-15' }
  ]
};

/* ---------------- Content: the Passport to Success pack, de-duplicated ---------------- */
const SESSIONS = {
  '1': {
    n: 1, title: 'Roles, Agenda, Expectations & Weekly Commitment', short: 'Roles & commitment',
    by: 'President or Past President',
    why: 'New members don’t know what they don’t know, so the President leads the conversation and sets out what matters.',
    covers: [
      'The Leadership Team roles, and that every member is expected to take one on at some point during their membership',
      'The weekly meeting agenda, step by step, and how the meeting is run',
      'Expectations: be there 30 minutes before the start for open networking, stay to the end, be professional and respectful, keep to the attendance policy, make time outside the meeting for 121s and training, and bring visitors',
      'The weekly commitment: a valid contribution every week. “I have a referral for…”, “I have brought a visitor…” or “I have a written testimonial for…”. A 121 or a Chapter Education Unit is not a valid contribution; a Thank You For The Business can be announced but does not count. Nobody passes.',
      'The BNI Code of Ethics'
    ],
    bring: ['A copy of the BNI Member Policies brochure', 'The weekly meeting agenda'],
    prep: ['Skim the weekly meeting agenda and note anything that puzzled you in your first meetings'],
    actions: [
      'Decide your default contribution for the next four weeks. When you are new, a visitor is the easiest one to deliver.',
      'Read the Code of Ethics on the inside back cover of your Passport',
      'Name one Leadership Team role you could see yourself doing in a year'
    ],
    mentorNotes: [
      'Walk through the agenda with the Member Policies brochure open and ask what they did not follow in their first meetings',
      'Be clear that passing in the contribution round is not an option and is noticed by the room',
      'Refer anything you cannot answer to the Ambassador or Director Consultant'
    ]
  },
  '2': {
    n: 2, title: 'Rules of the Game, PALMS Report & Member Traffic Lights', short: 'Policies, PALMS & Traffic Lights',
    by: 'Vice President or Past Vice President',
    why: 'The VP oversees the Membership Committee, so this is the person to explain how the chapter measures itself and why.',
    covers: [
      'The BNI General Policies, in particular Policy 5 (attendance) and Policy 6 (bring bona fide referrals and visitors)',
      'The PALMS report pulled from BNI Connect: Present, Absent, Late, Medical or managed absence, Substitute, plus referrals given and received (internal and external), visitors, 121s, Thank You For The Business, Chapter Education Units and testimonials',
      'Member Traffic Lights: PALMS numbers combined with training attended give a score out of 100, banded Green, Amber, Red and Grey. New members show as Blue for their first three months.',
      'How to get into Green early: be present, do your Passport 121s and Power Team 121s, bring people, give testimonials. Referrals come once relationships exist, so inviting is your contribution in the early weeks.'
    ],
    bring: ['The BNI Member Policies (bni.co.uk/policies)', 'A recent PALMS report for the chapter', 'The latest Member Traffic Lights'],
    prep: ['Read the BNI General Policies before you meet and bring any questions', 'Have a look at your own line on the PALMS report if you have been sent one'],
    actions: [
      'Set a target date to be in Green on the Traffic Lights',
      'Pick two things from the PALMS list you can do every week from now (being present and a 121 are the obvious two)',
      'Keep the policies link somewhere you can find it'
    ],
    mentorNotes: [
      'Review the policies yourself beforehand so you can answer questions on them',
      'Explain that the chapter runs like a business: it tracks activity weekly because that is what produces results for members',
      'Treat the Traffic Lights as a prompt for how to contribute more, not a league table to be anxious about'
    ]
  },
  '3': {
    n: 3, title: 'Biography Sheet, Speaker Rotation, Chapter Fees & Membership Renewal', short: 'Bio, speakers, fees & renewal',
    by: 'Secretary/Treasurer or Past Secretary/Treasurer',
    why: 'The Secretary/Treasurer reads the bio out before a Feature Presentation and runs the money side, so this is the natural owner.',
    covers: [
      'Your Biography Sheet in BNI Connect: it introduces you just before your Feature Presentation. Keep it positive, use it to educate the room and build credibility, and if you share something nobody knows about you, make sure it builds your image rather than embarrasses you.',
      'Speaker rotation: once you have completed the Member Success Programme you join the rota for an 8 to 10 minute Feature Presentation, your chance to teach the room how to find referrals for you',
      'Chapter fees: a weekly meeting fee, paid monthly. Check how to set up payment if you have not already.',
      'Membership renewal: the process starts 90 days before your expiry date, BNI dues are due 30 days before, and renewals are at the discretion of the Membership Committee'
    ],
    bring: ['How the chapter collects fees and sets up payment', 'The next Member Success Programme dates'],
    prep: ['Log into BNI Connect and find the bio section so you know where it lives'],
    actions: [
      'Complete your bio in BNI Connect this week',
      'Set up your chapter fee payment with the Secretary/Treasurer if it is not already running',
      'Book the Member Success Programme if you have not done so. You cannot present until you have been.'
    ],
    mentorNotes: [
      'Ask whether they need help finding and registering for the next Member Success Programme online',
      'Explain venue or meeting fees if your chapter has them'
    ]
  },
  '4': {
    n: 4, title: 'Attendance & Substitutes', short: 'Attendance & substitutes',
    by: 'Membership Committee member',
    why: 'Attendance is the policy new members most often fall foul of, and the Membership Committee is the body that enforces it.',
    covers: [
      'General Policy 5: you may not miss more than three meetings in a rolling six-month period. On the fourth absence the Membership Committee may open your classification.',

/* ---------------- Helpers ---------------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseISO(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); if(!y||!m||!d) return null; return new Date(y,m-1,d); }
function fmt(s){ const d=parseISO(s); return d ? `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` : ''; }
function fmtShort(s){ const d=parseISO(s); return d ? `${d.getDate()} ${MONTHS[d.getMonth()]}` : ''; }
function addDays(s,n){ const d=parseISO(s); if(!d) return ''; d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function daysBetween(a,b){ const da=parseISO(a), db=parseISO(b); if(!da||!db) return null; return Math.round((db-da)/86400000); }
function load(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function uid(){ return Math.random().toString(36).slice(2,9); }
function itemTitle(k){ return SESSIONS[k] ? SESSIONS[k].title : MILESTONES[k].title; }
function itemShort(k){ return SESSIONS[k] ? SESSIONS[k].short : MILESTONES[k].short; }
function itemLabel(k){ return SESSIONS[k] ? 'S'+k : MILESTONES[k].label; }
function lcA(s){ return String(s).replace(/^A /,'a '); }
function itemBy(k){ return SESSIONS[k] ? SESSIONS[k].by : MILESTONES[k].by; }
function blankItems(){ const o={}; ORDER.forEach(k=>o[k]={done:'',mentor:''}); return o; }
function normalise(items){ const o=blankItems(); if(items) ORDER.forEach(k=>{ if(items[k]) o[k]={done:items[k].done||'',mentor:items[k].mentor||''}; }); return o; }

/* Progress and pace. Expected pace: one session a week from induction, over 10 weeks; milestones are extra. */
function progress(m, asOf){
  asOf = asOf || todayISO();
  const items = normalise(m.items);
  const done = ORDER.filter(k=>items[k].done).length;
  const sessionsDone = Object.keys(SESSIONS).filter(k=>items[k].done).length;
  const days = m.inducted ? daysBetween(m.inducted, asOf) : null;
  const week = days==null ? null : Math.floor(Math.max(0,days)/7)+1;
  const target = m.inducted ? addDays(m.inducted, TARGET_DAYS) : '';
  const next = RECOMMENDED.find(k => SESSIONS[k] && !items[k].done) || null;
  let status, tone;
  if (done === ORDER.length) { status='Complete'; tone='grey'; }
  else if (days==null) { status='No induction date'; tone='grey'; }
  else if (days > TARGET_DAYS) { status='Overdue'; tone='red'; }
  else {
    const expected = Math.min(10, Math.floor(days/7));   // sessions you would expect by now at one a week
    if (sessionsDone < expected - 1) { status='Behind pace'; tone='amber'; }
    else { status='On track'; tone='green'; }
  }
  return { items, done, sessionsDone, days, week, target, next, status, tone, total: ORDER.length };
}

    h += `<div class="notice"><strong>Passport complete.</strong> <span class="small">Tell your Mentor Coordinator so the President can present your Completion Certificate in the Notable Networker slot.</span></div>`;

  h += `<h4 style="margin-top:.25rem">Sessions</h4>`;
  ORDER.forEach(k => {

        </div>
        <div class="status">${stamp}</div>
      </button>
      ${open ? `<div class="pagebody">
        ${isMs ? `<p class="prose">${esc(MILESTONES[k].text)}</p>` : `
          <p class="small muted prose">${esc(s.why)}</p>

          </div>`}

          <label class="small muted" style="display:grid;gap:.25rem">${isMs?'Signed by':'Mentor'}<input data-item="${k}" data-field="mentor" value="${esc(it.mentor)}" placeholder="${esc(mentorText(k) || 'Name')}" style="max-width:220px"></label>
          <label class="small muted" style="display:grid;gap:.25rem">Date<input type="date" data-item="${k}" data-field="done" value="${esc(it.done)}"></label>

  h += `<div class="card flat prose stack">
    <h3>Finishing</h3>

    <div class="row"><button class="btn sm" data-act="reset-me">Clear my passport on this device</button></div>
  </div>`;

}

function bookingMessage(k, name){
  const s = SESSIONS[k];
  return `Hi${name ? ' ' + name : ''}, I’m your Member Mentor for Passport session ${k}: ${s.short}. It’s an hour, mostly the two of us getting to know each other, with about fifteen minutes on ${s.short.toLowerCase()}. Could you do one of these?\n\n• [day/time option 1]\n• [day/time option 2]\n\nBefore we meet: ${s.prep[0].replace(/\.$/,'')}. Bring your Passport so I can sign it.`;
}
function cribText(k){
  const s = SESSIONS[k];
  const L = [];
  L.push(`MEMBER MENTOR #${k}: ${s.title.toUpperCase()}`);
  L.push(`Delivered by: ${s.by}`);
  L.push(`Timing: 10–15 minutes on BNI content; the rest of the hour on GAINS and the relationship.`);
  L.push(''); L.push('BRING'); s.bring.forEach(x=>L.push('- '+x));
  L.push(''); L.push('TALK THROUGH'); s.covers.forEach((x,i)=>L.push(`${i+1}. ${x}`));
  L.push(''); L.push('MENTOR NOTES'); s.mentorNotes.forEach(x=>L.push('- '+x));
  L.push(''); L.push('THEIR ACTIONS'); s.actions.forEach(x=>L.push('- '+x));
  L.push(''); L.push('Before you part: GAINS, sign the Passport, confirm who they book next.');
  return L.join('\n');
}

function weeklySummary(){
  const ms = tracker.members.slice().sort((a,b)=> (a.inducted||'9') < (b.inducted||'9') ? -1 : 1);
  const L = [];
  L.push(`Passport to Success${tracker.chapter?' – '+tracker.chapter:''} – ${fmt(todayISO())}`);
  ms.forEach(m => {
    const p = progress(m);
    let line = `• ${m.name}${m.trade?' ('+m.trade+')':''} – `;
    if (p.status==='Complete') line += `complete, ${p.done}/${p.total}. Certificate due.`;
    else {
      line += `${p.week?'week '+p.week+', ':''}${p.done}/${p.total} stamped, ${p.status.toLowerCase()}`;
      if (p.next) line += `. Next: S${p.next} ${SESSIONS[p.next].short}${p.items[p.next].mentor?' with '+p.items[p.next].mentor:(mentorText(p.next)?' ('+mentorText(p.next)+')':' (mentor to be paired)')}`;
    }
    L.push(line);
  });
  L.push('');
  L.push('Mentors: please book your next 121 with your new member this week and let me know when it’s done.');
  return L.join('\n');
}

/* ---------------- Render & routing ---------------- */
const VIEWS = { passport: renderPassport, mentor: renderMentor, tracker: renderTracker, reference: renderReference };
function render(){
  const v = VIEWS[ui.view] ? ui.view : 'passport';
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.view===v)));
  $('#view').innerHTML = VIEWS[v]();
  save(KEY_UI, ui);
}
function setView(v, opts={}){
  ui.view = v; if (opts.session) ui.session = opts.session;
  render();
  try { history.replaceState(null, '', '#' + (v==='mentor' ? 'mentor-'+ui.session : v)); } catch(e){}
  if (!opts.keepScroll) window.scrollTo({ top: 0 });
}
function routeFromHash(){
  const hsh = (location.hash||'').replace('#','');
  const m = hsh.match(/^mentor-(\d{1,2})$/);
  if (m && SESSIONS[m[1]]) { ui.view='mentor'; ui.session=m[1]; }
  else if (VIEWS[hsh]) ui.view = hsh;
}

/* ---------------- Clipboard & sheet ---------------- */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }
function openSheet(title, help, text, actions){
  $('#sheet-title').textContent = title; $('#sheet-help').textContent = help||'';
  const ta = $('#sheet-text'); ta.value = text||''; ta.readOnly = !actions || !actions.some(a=>a.id==='load');
  const row = $('#sheet-actions'); row.innerHTML = '';
  (actions||[]).forEach(a => { const b=document.createElement('button'); b.className='btn '+(a.primary?'primary':''); b.textContent=a.label; b.addEventListener('click', ()=>a.run(ta)); row.appendChild(b); });
  $('#overlay').hidden = false; setTimeout(()=>{ ta.focus(); if (ta.readOnly) ta.select(); }, 30);
}
function closeSheet(){ $('#overlay').hidden = true; }
async function copyText(text, label){
  try { await navigator.clipboard.writeText(text); toast((label||'Copied')+' to clipboard'); }
  catch(e){ openSheet(label||'Copy', 'Copying was blocked here. Select the text below and copy it yourself.', text, [{label:'Close', run: closeSheet}]); }
}

/* ---------------- Events ---------------- */
$('#tabs').addEventListener('click', e => { const t=e.target.closest('.tab'); if (t) setView(t.dataset.view); });
$('#sheet-close').addEventListener('click', closeSheet);
$('#overlay').addEventListener('click', e => { if (e.target.id==='overlay') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') closeSheet(); });

function memberById(id){ return tracker.members.find(m=>m.id===id); }

$('#view').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, k = b.dataset.k, id = b.dataset.id;
  switch (act) {
    case 'toggle-setup': me.open.setup = !me.open.setup; save(KEY_ME, me); render(); break;
    case 'toggle-page': me.open[k] = !me.open[k]; save(KEY_ME, me); render(); break;
    case 'stamp': me.items[k].done = todayISO(); save(KEY_ME, me); render(); toast('Stamped'); break;
    case 'unstamp': me.items[k].done = ''; save(KEY_ME, me); render(); break;
    case 'reset-me': if (b.dataset.sure) { me = { name:'', trade:'', inducted:'', items: blankItems(), open:{ setup: true } }; save(KEY_ME, me); render(); toast('Cleared'); } else { b.dataset.sure='1'; b.textContent='Tap again to clear'; b.classList.add('danger'); } break;
    case 'pick': setView('mentor', { session: k, keepScroll: true }); $('#crib')?.scrollIntoView({ behavior:'smooth', block:'start' }); break;
    case 'copy-booking': copyText(bookingMessage(k, ''), 'Booking message'); break;
    case 'copy-crib': copyText(cribText(k), 'Crib sheet'); break;
    case 'copy-link': { const base = location.href.split('#')[0]; copyText(base + '#mentor-' + k, 'Link'); break; }
    case 'copy-invite': copyText(INVITE_SCRIPT, 'Invitation script'); break;
    case 'copy-summary': copyText(weeklySummary(), 'Weekly summary'); break;
    case 'export': openSheet('Export tracker', 'Copy this and keep it somewhere safe, or paste it into the Import box on another device.', JSON.stringify(tracker, null, 2), [{label:'Copy', primary:true, run: ta => copyText(ta.value, 'Tracker data')}, {label:'Close', run: closeSheet}]); break;
    case 'import': openSheet('Import tracker', 'Paste an export here. It replaces what is on this device.', '', [{id:'load', label:'Load', primary:true, run: ta => {
        try { const d = JSON.parse(ta.value); if (!d || !Array.isArray(d.members)) throw new Error('shape');
          tracker = { chapter: d.chapter||'', members: d.members.map(m => ({ id:m.id||uid(), name:m.name||'', trade:m.trade||'', inducted:m.inducted||'', items:normalise(m.items), open:false })) };
          save(KEY_TR, tracker); closeSheet(); render(); toast('Tracker loaded'); }
        catch(err){ $('#sheet-help').textContent = 'That does not look like an export from this tracker. Paste the whole text, starting with { and ending with }.'; }
      }}, {label:'Cancel', run: closeSheet}]); break;
    case 'cell': { const m = memberById(id); if (!m) return; const it = m.items[k]; it.done = it.done ? '' : todayISO(); save(KEY_TR, tracker); render(); break; }
    case 'toggle-member': { const m = memberById(id); if (m) { m.open = !m.open; save(KEY_TR, tracker); render(); } break; }
    case 'remove': confirmId = id; render(); break;
    case 'remove-cancel': confirmId = null; render(); break;
    case 'remove-confirm': tracker.members = tracker.members.filter(m=>m.id!==id); confirmId=null; save(KEY_TR, tracker); render(); toast('Removed'); break;
    case 'reset-checks': checks = {}; save(KEY_CK, checks); render(); break;
    case 'reset-tracker': if (b.dataset.sure) { tracker = seedTracker(); save(KEY_TR, tracker); render(); toast('Tracker reset'); } else { b.dataset.sure='1'; b.textContent='Tap again to replace everything on this device'; b.classList.add('danger'); } break;
  }
});

$('#view').addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.check) { checks[el.dataset.check] = el.checked; save(KEY_CK, checks); el.closest('label').classList.toggle('done', el.checked); return; }
  if (el.dataset.bind === 'me.inducted') { me.inducted = el.value; save(KEY_ME, me); render(); return; }
  if (el.dataset.item && !el.dataset.mid) { me.items[el.dataset.item][el.dataset.field] = el.value; save(KEY_ME, me); if (el.dataset.field==='done') render(); return; }
  if (el.dataset.mid) {
    const m = memberById(el.dataset.mid); if (!m) return;
    if (el.dataset.mfield) m[el.dataset.mfield] = el.value; else m.items[el.dataset.item][el.dataset.field] = el.value;
    save(KEY_TR, tracker); render(); return;
  }
});
$('#view').addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind === 'me.name') { me.name = el.value; save(KEY_ME, me); }
  else if (el.dataset.bind === 'me.trade') { me.trade = el.value; save(KEY_ME, me); }
  else if (el.dataset.bind === 'tracker.chapter') { tracker.chapter = el.value; save(KEY_TR, tracker); const h = el.closest('.card').querySelector('h2'); if (h) h.textContent = el.value || 'Chapter tracker'; }
  else if (el.dataset.item && !el.dataset.mid && el.dataset.field==='mentor') { me.items[el.dataset.item].mentor = el.value; save(KEY_ME, me); }
  else if (el.dataset.mid && el.dataset.field==='mentor') { const m = memberById(el.dataset.mid); if (m) { m.items[el.dataset.item].mentor = el.value; save(KEY_TR, tracker); } }
});
$('#view').addEventListener('submit', e => {
  if (e.target.id !== 'add-form') return;
  e.preventDefault();
  const name = $('#add-name').value.trim(); if (!name) return;
  tracker.members.push({ id: uid(), name, trade: $('#add-trade').value.trim(), inducted: $('#add-inducted').value, items: blankItems(), open: false });
  save(KEY_TR, tracker); render(); toast(name + ' added');
});

window.addEventListener('hashchange', () => { routeFromHash(); render(); });
if (CHAPTER.name) $('#eyebrow').textContent = CHAPTER.name + ' · new member mentoring';
routeFromHash();
render();
</script>
</body>
</html>
